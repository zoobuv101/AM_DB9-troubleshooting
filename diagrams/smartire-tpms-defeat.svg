<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold">SmarTire TPMS defeat cable — 4-wire receiver (DB9/V8 Vantage c.2007–2010)</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#555">Inline cable: car harness plug ⇄ defeat cable ⇄ receiver pigtail. TE Multilock 070, 4-way, 3.5 mm pitch.</text>

  <!-- Car harness side -->
  <text x="130" y="96" text-anchor="middle" font-weight="bold">CAR HARNESS</text>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#555">existing plug (socket contacts)</text>
  <rect x="60" y="130" width="140" height="330" rx="8" fill="#f4f1ea" stroke="#333" stroke-width="2"/>

  <!-- Defeat cable car-side housing -->
  <text x="370" y="96" text-anchor="middle" font-weight="bold">DEFEAT CABLE — car end</text>
  <text x="370" y="114" text-anchor="middle" font-size="12" fill="#555">174929-1 cap housing + 173645-1 tabs</text>
  <rect x="300" y="130" width="140" height="330" rx="8" fill="#eef4fb" stroke="#1d4f91" stroke-width="2"/>

  <!-- Defeat cable receiver-side housing -->
  <text x="630" y="96" text-anchor="middle" font-weight="bold">DEFEAT CABLE — receiver end</text>
  <text x="630" y="114" text-anchor="middle" font-size="12" fill="#555">174922-1 plug housing + 173631-1 sockets</text>
  <rect x="560" y="130" width="140" height="330" rx="8" fill="#eef4fb" stroke="#1d4f91" stroke-width="2"/>

  <!-- Receiver -->
  <text x="870" y="96" text-anchor="middle" font-weight="bold">SMARTIRE RECEIVER</text>
  <text x="870" y="114" text-anchor="middle" font-size="12" fill="#555">AM 8G43-37807-BA pigtail (tab contacts)</text>
  <rect x="800" y="130" width="140" height="330" rx="8" fill="#f4f1ea" stroke="#333" stroke-width="2"/>

  <!-- Row y positions: VIGN 180, GND 260, ALERT 340, DIAG 420 -->
  <!-- Car harness labels -->
  <g font-size="12">
    <text x="70" y="168" font-weight="bold">VIGN (C1537-1)</text>
    <text x="70" y="184">red / blue tracer</text>
    <text x="70" y="248" font-weight="bold">GND (C1537-2)</text>
    <text x="70" y="264">black / pink</text>
    <text x="70" y="328" font-weight="bold">ALERT (C1537-3)</text>
    <text x="70" y="344">red → DIM C0230-24</text>
    <text x="70" y="358" fill="#555">"TYRE PRESS. FLT"</text>
    <text x="70" y="408" font-weight="bold">DIAG (C1537-4)</text>
    <text x="70" y="424">white → DIM C0230-23</text>
    <text x="70" y="438" fill="#555">"TYRE PRESS. LOW"</text>
  </g>

  <!-- mating marks car harness ⇄ cable car end -->
  <g stroke="#333" stroke-width="2">
    <line x1="200" y1="180" x2="300" y2="180"/>
    <line x1="200" y1="260" x2="300" y2="260"/>
    <line x1="200" y1="340" x2="300" y2="340"/>
    <line x1="200" y1="420" x2="300" y2="420"/>
  </g>
  <g fill="#333">
    <circle cx="300" cy="180" r="5"/><circle cx="300" cy="260" r="5"/><circle cx="300" cy="340" r="5"/><circle cx="300" cy="420" r="5"/>
  </g>
  <text x="250" y="478" text-anchor="middle" font-size="12" fill="#555">plugs together</text>

  <!-- pass-through wires -->
  <line x1="440" y1="180" x2="560" y2="180" stroke="#c0392b" stroke-width="5"/>
  <line x1="440" y1="180" x2="560" y2="180" stroke="#2e6fd1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="170" text-anchor="middle" font-size="12">VIGN straight through</text>
  <line x1="440" y1="260" x2="560" y2="260" stroke="#222" stroke-width="5"/>
  <text x="500" y="250" text-anchor="middle" font-size="12">GND straight through</text>

  <!-- jumpers on car end: ALERT & DIAG to GND -->
  <path d="M 420 340 C 470 340, 470 260, 440 262" fill="none" stroke="#e67e22" stroke-width="4"/>
  <path d="M 420 420 C 490 420, 490 262, 440 264" fill="none" stroke="#e67e22" stroke-width="4"/>
  <circle cx="420" cy="340" r="5" fill="#e67e22"/>
  <circle cx="420" cy="420" r="5" fill="#e67e22"/>
  <text x="370" y="336" text-anchor="middle" font-size="12">ALERT tab</text>
  <text x="370" y="416" text-anchor="middle" font-size="12">DIAG tab</text>
  <text x="370" y="184" text-anchor="middle" font-size="12">VIGN tab</text>
  <text x="370" y="264" text-anchor="middle" font-size="12">GND tab</text>
  <text x="515" y="380" font-size="12" fill="#b35400" font-weight="bold">jumpers:</text>
  <text x="515" y="396" font-size="12" fill="#b35400">ALERT → GND</text>
  <text x="515" y="412" font-size="12" fill="#b35400">DIAG → GND</text>

  <!-- receiver end: signal sockets empty -->
  <text x="630" y="184" text-anchor="middle" font-size="12">VIGN socket</text>
  <text x="630" y="264" text-anchor="middle" font-size="12">GND socket</text>
  <text x="630" y="344" text-anchor="middle" font-size="12" fill="#888">empty</text>
  <text x="630" y="424" text-anchor="middle" font-size="12" fill="#888">empty</text>
  <g stroke="#888" stroke-width="2" fill="none">
    <circle cx="660" cy="340" r="6"/><circle cx="660" cy="420" r="6"/>
  </g>

  <!-- mating marks cable receiver end ⇄ receiver -->
  <g stroke="#333" stroke-width="2">
    <line x1="700" y1="180" x2="800" y2="180"/>
    <line x1="700" y1="260" x2="800" y2="260"/>
  </g>
  <g stroke="#bbb" stroke-width="2" stroke-dasharray="4 4">
    <line x1="700" y1="340" x2="800" y2="340"/>
    <line x1="700" y1="420" x2="800" y2="420"/>
  </g>
  <text x="750" y="478" text-anchor="middle" font-size="12" fill="#555">plugs together</text>

  <!-- receiver labels -->
  <g font-size="12">
    <text x="810" y="176" font-weight="bold">VIGN</text>
    <text x="810" y="192">red</text>
    <text x="810" y="256" font-weight="bold">GND</text>
    <text x="810" y="272">black</text>
    <text x="810" y="336" font-weight="bold">ALERT out</text>
    <text x="810" y="352">orange</text>
    <text x="810" y="366" fill="#888">not connected</text>
    <text x="810" y="416" font-weight="bold">DIAG out</text>
    <text x="810" y="432">brown</text>
    <text x="810" y="446" fill="#888">not connected</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#333">
    <text x="60" y="510" font-weight="bold">Notes</text>
    <text x="60" y="530">• Pinout: DB9 workshop manual circuit sheet 18-1-62 (Oct 2007) — receiver C1537, DIM C0230.</text>
    <text x="60" y="548">• Car colours as seen on a 2009 DB9; the 2007 sheet shows VIGN WG, GND B, ALERT R, DIAG W.</text>
    <text x="60" y="566">• Receiver outputs drive +12 V on a fault; cut them and hold ALERT + DIAG at GND = warnings off.</text>
    <text x="60" y="584">• Simpler dongle: car-end housing only (ALERT + DIAG jumpered to GND), receiver unplugged.</text>
    <text x="60" y="602">• TPMS gives no tyre warnings with this fitted — check pressures manually.</text>
  </g>
</svg>
