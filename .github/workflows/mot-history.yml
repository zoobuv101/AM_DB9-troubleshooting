name: Refresh MOT history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC — also keeps the DVSA API key alive (90-day revocation)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MOT history (no-op until DVSA secrets are configured)
        env:
          DVSA_CLIENT_ID: ${{ secrets.DVSA_CLIENT_ID }}
          DVSA_CLIENT_SECRET: ${{ secrets.DVSA_CLIENT_SECRET }}
          DVSA_TOKEN_URL: ${{ secrets.DVSA_TOKEN_URL }}
          DVSA_SCOPE: ${{ secrets.DVSA_SCOPE }}
          DVSA_API_KEY: ${{ secrets.DVSA_API_KEY }}
          VEHICLE_REG: ${{ secrets.VEHICLE_REG }}
        run: python3 scripts/fetch_mot.py

      - name: Commit if changed
        run: |
          git config user.name "mot-history-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet mot-history.json; then
            git add mot-history.json
            git commit -m "Refresh MOT history data"
            git push
          else
            echo "No changes."
          fi
