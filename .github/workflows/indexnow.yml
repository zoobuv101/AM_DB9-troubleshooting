name: IndexNow

# After each successful GitHub Pages build, tell IndexNow (Bing, Yandex, Seznam, Naver, Yep)
# which pages changed since the last successful notification. Google doesn't use IndexNow,
# so the sitemap is also resubmitted to Google Search Console.
on:
  page_build:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page in sitemap.xml"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.build.commit || github.sha }}

      - name: Submit all pages
        if: github.event_name == 'workflow_dispatch' && inputs.all
        run: python3 scripts/indexnow.py --all

      - name: Submit pages changed since the previous deploy
        if: github.event_name == 'page_build'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.build.commit }}
        run: |
          # Base = the commit of the previous successful IndexNow run (so a burst of pushes is covered)
          BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow IndexNow --event page_build --status success -L 20 \
                   --json headSha --jq "[.[] | select(.headSha != \"$HEAD_SHA\") | .headSha][0]")
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$HEAD_SHA~1"; fi
          echo "Changes $BASE..$HEAD_SHA"
          python3 scripts/indexnow.py "$BASE" "$HEAD_SHA"

      - name: Resubmit sitemap to Google
        continue-on-error: true
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: |
          pip install --quiet google-auth requests
          python3 scripts/google_sitemap.py
