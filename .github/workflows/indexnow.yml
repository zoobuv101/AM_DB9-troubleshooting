name: IndexNow

# After each successful GitHub Pages deploy, tell IndexNow (Bing, Yandex, Seznam, Naver, Yep)
# which pages changed since the previous successful deploy. Google doesn't use IndexNow.
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page in sitemap.xml"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Submit all pages
        if: github.event_name == 'workflow_dispatch' && inputs.all
        run: python3 scripts/indexnow.py --all

      - name: Submit pages changed since the previous deploy
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "pages build and deployment" --status success -L 20 \
                   --json databaseId,headSha --jq "[.[] | select(.databaseId != $RUN_ID) | .headSha][0]")
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$HEAD_SHA~1"; fi
          echo "Changes $BASE..$HEAD_SHA"
          python3 scripts/indexnow.py "$BASE" "$HEAD_SHA"
